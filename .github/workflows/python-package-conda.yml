name: VIP Apuestas CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then 
          pip install -r requirements.txt
          echo "✅ Dependencias instaladas desde requirements.txt"
        else
          echo "⚠️ No hay requirements.txt, instalando básicas"
          pip install aiohttp requests python-dotenv
        fi
        pip list | head -10
    
    - name: Verificar estructura
      run: |
        echo "📁 Estructura del proyecto:"
        ls -la
        echo ""
        if [ -f script.py ]; then
          echo "✅ script.py existe"
        else
          echo "❌ script.py NO existe"
          exit 1
        fi
        if [ -f requirements.txt ]; then
          echo "✅ requirements.txt existe"
        else
          echo "⚠️ requirements.txt NO existe"
        fi
    
    - name: Verificar sintaxis de Python
      run: |
        python -m py_compile script.py
        echo "✅ script.py compila correctamente"
    
    - name: Prueba de ejecución
      run: |
        python -c "
import sys
print('✅ Python version:', sys.version)
print('✅ Sistema funcionando')
try:
    import script
    print('✅ script.py importado correctamente')
except Exception as e:
    print('❌ Error:', e)
    sys.exit(1)
"
