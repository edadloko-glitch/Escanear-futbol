import os
import requests
from datetime import datetime

TOKEN_BOT = os.getenv("TELEGRAM_BOT_TOKEN")
CHAT_ID = os.getenv("TELEGRAM_CHAT_ID")

def calcular_variacion_cuota(cuota_inicial, cuota_actual):
    if cuota_inicial <= 0:
        return 0.0
    aumento = ((cuota_actual - cuota_inicial) / cuota_inicial) * 100
    return round(aumento, 2)

def enviar_a_telegram(mensaje):
    if not TOKEN_BOT or not CHAT_ID:
        print("Error: Faltan las credenciales de Telegram en las variables de entorno.")
        return
        
    url = f"https://api.telegram.org/bot{TOKEN_BOT}/sendMessage"
    payload = {
        "chat_id": CHAT_ID,
        "text": mensaje,
        "parse_mode": "Markdown"
    }
    
    try:
        response = requests.post(url, json=payload)
        if response.status_code == 200:
            print("¡Alerta enviada con éxito a Telegram!")
        else:
            print(f"Error al enviar: {response.text}")
    except Exception as e:
        print(f"Excepción de red: {e}")

def generar_alerta_vip(partido, minuto, marcador, cuota_ini, cuota_act, mercado="To Qualify"):
    porcentaje = calcular_variacion_cuota(cuota_ini, cuota_act)
    fecha_actual = datetime.now().strftime("%d %b %Y, %H:%M")
    
    mensaje = (
        f"⚽ *{partido}*\n"
        f"⭐ *Stake 1%* • Confianza Media  |  ⏳ {fecha_actual}\n\n"
        f"📌 *Al momento del pick:*\n"
        f"• Minuto: {minuto}'\n"
        f"• Marcador: {marcador}\n"
        f"• Cuotas: {mercado}: 1 @ {cuota_act}\n\n"
        f"📊 *Cambio de cuotas:*\n"
        f"{cuota_ini:.2f} ➔ {cuota_act:.2f} (+{porcentaje}% Subida mín.)"
    )
    return mensaje

if __name__ == "__main__":
    print("Iniciando motor de escaneo Showhar...")
    alerta = generar_alerta_vip(
        partido="France – Spain",
        minuto=45,
        marcador="0-1",
        cuota_ini=1.70,
        cuota_act=2.04
    )
    enviar_a_telegram(alerta)
    
